[project]
name = "yuktara-api"
version = "0.1.0"
description = "Yuktara backend: multi-table writes for the coaching app (FastAPI + Supabase Postgres)."
requires-python = ">=3.12"
# Pinned exactly. Upgrade on purpose, then run `pip-audit` and the tests.
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "asyncpg==0.31.0",
  "pydantic-settings==2.15.0",
  "pyjwt[crypto]==2.15.1",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.10",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = [
  "S101",   # assert is fine in tests
  "RUF001", # we use typographic dashes and quotes in user-facing text
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency idiom
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"] # fake secrets in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["db: needs a local Supabase database (TEST_DATABASE_URL)"]
filterwarnings = [
  # Comes from starlette's TestClient itself; nothing to change on our side.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
