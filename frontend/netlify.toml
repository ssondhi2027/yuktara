[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Public pages are real files (scripts/prerender.mjs): / is index.html, /privacy is
# privacy/index.html, plus sitemap.xml and robots.txt. Files are served first;
# every other route is the app, from the plain shell (app.html, noindex).
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# App pages behind sign-in stay out of search results (robots.txt also asks crawlers to skip them).
[[headers]]
  for = "/app.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/login"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/train"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/train/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/food"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/check-in"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/check-in/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/progress"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/messages"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/settings"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/coach"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/coach/*"
  [headers.values]
    X-Robots-Tag = "noindex"
