name: Deploy

# On every push to main, in this order:
#   1. database migrations (needs a manual approval in the "production" environment)
#   2. Render (API) via the Render API
#   3. Netlify (site) via its build hook
# Render and Netlify auto-deploys must be off, or they race the migration (docs/api.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never stop a migration half way

jobs:
  migrate:
    name: Migrate database
    runs-on: ubuntu-latest
    environment: production # add required reviewers to this environment in GitHub settings
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Show pending migrations
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
      - name: Push migrations (and the exercise-library seed the first time)
        run: supabase db push --include-seed --password "$SUPABASE_DB_PASSWORD"

  deploy-api:
    name: Deploy API (Render)
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Trigger deploy
        run: |
          test -n "$RENDER_API_KEY" || { echo "RENDER_API_KEY not set"; exit 1; }
          test -n "$RENDER_SERVICE_ID" || { echo "RENDER_SERVICE_ID not set"; exit 1; }
          deploy_id=$(curl -fsS -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" | jq -r '.id')
          if [ -z "$deploy_id" ] || [ "$deploy_id" = "null" ]; then echo "could not start Render deploy"; exit 1; fi
          echo "Started Render deploy $deploy_id"
          echo "DEPLOY_ID=$deploy_id" >> "$GITHUB_ENV"
      - name: Wait until the new version is live
        run: |
          for i in $(seq 1 60); do
            status=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" | jq -r '.status')
            echo "deploy status: $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 15
          done
          echo "timed out waiting for Render"; exit 1

  deploy-web:
    name: Deploy site (Netlify)
    needs: deploy-api
    runs-on: ubuntu-latest
    environment: production
    env:
      NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
    steps:
      - run: |
          test -n "$NETLIFY_BUILD_HOOK_URL" || { echo "NETLIFY_BUILD_HOOK_URL not set"; exit 1; }
          curl -fsS -X POST -d '{}' "$NETLIFY_BUILD_HOOK_URL" > /dev/null
